name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación (tipos, lint, pruebas, fidelidad curricular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/curriculum/independent/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install -r scripts/curriculum/independent/requirements.txt

      - name: Gate de la fuente curricular
        run: npm run curriculum:gate

      - name: Artefactos curriculares = recompilación determinista
        run: npm run curriculum:check

      - name: Doble lectura independiente (Python/openpyxl)
        run: npm run curriculum:verify-independent

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas
        run: npm test

  e2e:
    name: Prototipo e2e (360 px y escritorio, accesibilidad)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Construir prototipo (un solo HTML)
        run: npm run prototype:build

      - name: Recorridos e2e + axe
        run: npm run test:e2e

      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  app:
    name: App de producción (build, bundle, e2e, accesibilidad, LCP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de producción (Next.js, páginas estáticas)
        run: npm run app:build

      - name: La malla completa no viaja al navegador (F3-03)
        run: npm run app:check-bundle

      - name: e2e contra next start (URLs, fidelidad, axe, seguridad, LCP)
        run: npm run test:e2e:app

      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-app
          path: test-results/
          retention-days: 7
