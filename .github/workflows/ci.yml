name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación (tipos, lint, pruebas, fidelidad curricular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/curriculum/independent/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install -r scripts/curriculum/independent/requirements.txt

      - name: Gate de la fuente curricular
        run: npm run curriculum:gate

      - name: Artefactos curriculares = recompilación determinista
        run: npm run curriculum:check

      - name: Doble lectura independiente (Python/openpyxl)
        run: npm run curriculum:verify-independent

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas
        run: npm test
